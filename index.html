
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>安全跳转页面</title>
  <style>
    /* 三点加载动画样式 */
    .container {
      width: 100px;
      height: 100px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate-move 2s ease-in-out infinite;
      display: none;
    }
    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      position: absolute;
      顶端: 0;
      底部: 0;
      左边的: 0;
      正确: 0;
      边缘: 汽车;
    }
    .点-3 { 背景颜色:# f74d75动画: 点-3-移动 2s 缓解 无限的；无边的; }
    .点-2 { 背景颜色:# 10beae动画: 点2移动 2s 缓解 无限的；无边的; }
    .点-1 { 背景颜色:# ffe386动画: 点-1-移动 2s 缓解 无限的；无边的; }
    
    @关键帧 点-3-移动 {
      20%,100% { 改变: 规模(1) }
      45%,80% { 改变: 翻译(-18像素) 规模(.45) }
    }
    @关键帧 点2移动 {
      20%,100% { 改变: 规模(1) }
      45%,80% { 改变: 翻译(-16像素, 12像素) 规模(.45) }
    }
    @关键帧 点-1-移动 {
      20%,100% { 改变: 规模(1) }
      45%,80% { 改变: 翻译(16像素, 12像素) 规模(.45) }
    }
    @关键帧 旋转-移动 {
      55% { 改变: 翻译(-50%, -50%) 辐状的(0（同degree）度) }
      80%,100% { 改变: 翻译(-50%, -50%) 辐状的(360（同degree）度) }
    }

    /* 全局水印样式 */
    .水印 {
      位置: 固定的；不变的;
      指针事件: 没有人;
      宽度: 100%;
      高度: 100%;
      背景图像: 重复线性梯度(
        -45（同degree）度,
        rgba(255, 0, 0, 0.1),
        rgba(255, 0, 0, 0.1) 20像素,
        rgba(0, 0, 255, 0.1) 20像素,
        rgba(0, 0, 255, 0.1) 40像素
      );
      z指数: 9999;
      显示: 没有人;
    }
    .水印-文本 {
      位置: 绝对的;
      颜色: rgba(255, 0, 0, 0.6);
      字体大小: 18像素;
      字体粗细: 大胆的;
      文本对齐: 中心;
      宽度: 100%;
      顶端: 50%;
      改变: 翻译(-50%);
      文本阴影: 1像素 1像素 1像素# fff
    }

    /* iframe样式 */
    .内容 {
      高度: 100%;
      宽度: 100%;
      位置: 固定的；不变的;
      插入物: -2像素;
      z指数: 1;
    }
  </风格>
</头>

<身体>
  <!-- 三点加载动画容器 -->
  <差异 班级="集装箱" 身份证明（identification）="正在加载容器">
    <差异 班级="点点-1 "></差异>
    <差异 班级="点点-2 "></差异>
    <差异 班级="点点-3 "></差异>
  </差异>

  <!-- 全局水印 -->
  <差异 班级="水印" 身份证明（identification）="水印">
    <差异 班级="水印-文本">提示：请联系隆城网络VX:voip66666授权</差异>
  </差异>

  <脚本>
    (功能() {
      // 白名单域名配置（预留位置方便后期添加)
      常数 白名单_配置 = {
        域: [
          xffwz.com ',
          xffuw.com ',
          yaowei.xyz ',
          947p.cn ',
          ' 836k.cn ',
          ychy2.cn ',
          ' 836k.cn ',
          ' app.drixpay.com ',
          ' srgg.7tjmctp7.my ',    
          // 预留位置：在此添加新的白名单域名
          // 'app.drixpay.com '，
          //'另一个域. net '
        ],
        // 预留其他配置项
        watermarkText: '提示：请联系隆城网络VX：voip66666授权'
      };

      // 显示三点加载动画
      function showLoadingAnimation() {
        document.getElementById('loadingContainer').style.display = 'block';
      }

      // 验证URL域名是否在白名单
      function isAllowedDomain(url) {
        try {
          const domain = new URL(url).hostname.replace('www.', '');
          return WHITELIST_CONFIG.domains.some(allowedDomain => {
            return domain === allowedDomain || 
                   domain.endsWith('.' + allowedDomain);
          });
        } catch (e) {
          console.error('URL解析失败:', e);
          return false;
        }
      }
     
      // 主处理逻辑
      function processRedirect() {
        showLoadingAnimation();
        
        const urlParams = new URLSearchParams(window.location.search);
        const encodedParam = urlParams.get('c');
        
        if (!encodedParam) {
          document.getElementById('watermark').style.display = 'block';
          document.getElementById('loadingContainer').style.display = 'none';
          return;
        }
        
        try {
          const trueUrl = atob(encodedParam);
          if (trueUrl.includes("http")) {
            // 检查域名是否在白名单
            if (!isAllowedDomain(trueUrl)) {
              document.getElementById('watermark').style.display = 'block';
              document.querySelector('.watermark-text').textContent = WHITELIST_CONFIG.watermarkText;
            }
            
            // 创建并加载iframe
            const iframe = document.createElement('iframe');
            iframe.className = 'content';
            iframe.src = trueUrl;
            
            iframe.addEventListener('load', function() {
              document.getElementById('loadingContainer').style.display = 'none';
            });
            
            document.body.appendChild(iframe);
          }
        } catch (e) {
          console.error('URL解码失败:', e);
          document.getElementById('watermark').style.display = 'block';
          document.getElementById('loadingContainer').style.display = 'none';
        }
      }

      // 禁止F12开发者工具
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && e.key === 'I') || 
            (e.ctrlKey && e.shiftKey && e.key === 'J') || 
            (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
        }
      });

      processRedirect();
    })();
  </script>
</body>
</html>
